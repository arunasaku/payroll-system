<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Management System – Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            overflow: hidden;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: 0;
            animation: float 8s ease-in-out infinite;
        }
        body::before {
            width: 400px; height: 400px;
            background: #6c63ff;
            top: -100px; left: -100px;
        }
        body::after {
            width: 350px; height: 350px;
            background: #00c9ff;
            bottom: -80px; right: -80px;
            animation-delay: 4s;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: min(400px, calc(100% - 32px));
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #6c63ff, #00c9ff);
            border-radius: 14px;
            margin-bottom: 0.6rem;
        }
        .logo-icon svg {
            width: 26px; height: 26px;
            stroke: #fff; stroke-width: 2;
            fill: none; stroke-linecap: round; stroke-linejoin: round;
        }
        .logo-text {
            display: block;
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .logo-text span { color: #00c9ff; }
        .logo-subtitle {
            display: block;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-group input::placeholder { color: rgba(255, 255, 255, 0.3); }
        .form-group input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6c63ff, #00c9ff);
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.35);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 99, 255, 0.5);
        }
        .submit-btn:active { transform: translateY(0); }

        .msg {
            margin-top: 0.7rem;
            text-align: center;
            font-size: 0.85rem;
            min-height: 1.2em;
            font-weight: 500;
        }
        .msg.error { color: #ff6b6b; }
        .msg.success { color: #51cf66; }

        .footer-hint {
            text-align: center;
            margin-top: 1.4rem;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            line-height: 1.5;
        }

        /* Small phones / short screens */
        @media (max-width: 480px), (max-height: 620px) {
            body {
                overflow-y: auto;
                align-items: flex-start;
                padding: 20px 0;
            }
            .auth-container {
                padding: 1.6rem 1.2rem;
            }
            .logo-text { font-size: 1.3rem; }
            body::before { width: 260px; height: 260px; top: -80px; left: -80px; }
            body::after { width: 220px; height: 220px; bottom: -60px; right: -60px; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            </div>
            <span class="logo-text" style="font-size:1.3rem;line-height:1.3;">HR Management<br><span>System</span></span>
            <span class="logo-subtitle">Sign in to your account</span>
        </div>

        <div class="form-group">
            <label for="si-username">Username</label>
            <input type="text" id="si-username" placeholder="Enter your username" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="si-password">Password</label>
            <input type="password" id="si-password" placeholder="Enter your password" autocomplete="current-password">
        </div>
        <button class="submit-btn" id="signinBtn">Sign In</button>
        <div class="msg" id="si-msg"></div>

        <div class="footer-hint">
            Contact your administrator to create an account.
        </div>
    </div>

    <!-- Supabase JS Client & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        document.getElementById('signinBtn').addEventListener('click', () => {
            const user = document.getElementById('si-username').value.trim();
            const pass = document.getElementById('si-password').value;
            const msg = document.getElementById('si-msg');
            if (!user || !pass) {
                msg.className = 'msg error';
                msg.textContent = 'Please enter both fields.';
                return;
            }
            auth.login(user, pass).then(result => {
                if (result.success) {
                    msg.className = 'msg success';
                    msg.textContent = 'Welcome back! Redirecting...';
                    setTimeout(() => { window.location.href = 'index.html'; }, 600);
                } else {
                    msg.className = 'msg error';
                    msg.textContent = result.message;
                }
            });
        });

        ['si-username', 'si-password'].forEach(id => {
            document.getElementById(id).addEventListener('keydown', e => {
                if (e.key === 'Enter') document.getElementById('signinBtn').click();
            });
        });

        if (auth.getCurrentUser()) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
